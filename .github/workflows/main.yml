name: Deploy frontend to VPS

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      APP_DIR: ${{ vars.APP_DIR || secrets.APP_DIR }}     # e.g. /var/www/myapp
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}                   # e.g. deploy
      SSH_PORT: ${{ secrets.SSH_PORT }}                   # e.g. 22
      BUILD_DIR: dist                                     # change to 'build' if needed

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install deps & build
        run: |
          set -euxo pipefail
          npm ci || (npm install --package-lock-only && npm ci)
          npm run build
          test -d "$BUILD_DIR" || (echo "Build dir '$BUILD_DIR' not found" && exit 1)

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Trust host (known_hosts)
        run: |
          set -euxo pipefail
          mkdir -p ~/.ssh
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

      # Optional: quick visibility that the right key loaded
      - name: Show loaded SSH keys (public)
        run: ssh-add -L || true

      # Optional: prove connectivity before deploying
      - name: Test SSH connectivity
        run: |
          set -euxo pipefail
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "echo CI-SSH-OK"

      - name: Ensure server dirs & ownership
        run: |
          set -euxo pipefail
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" <<'EOSSH'
          set -e
          mkdir -p "$APP_DIR/releases"
          # app dir should already be owned by $SSH_USER; if not, do this once manually:
          # sudo chown -R $SSH_USER:$SSH_USER "$APP_DIR"
          EOSSH

      - name: Upload release
        run: |
          set -euxo pipefail
          rsync -azv --delete -e "ssh -p $SSH_PORT" \
            "$BUILD_DIR"/ "$SSH_USER@$SSH_HOST:$APP_DIR/releases/${GITHUB_SHA}/"

      - name: Activate release & (optionally) reload Nginx
        run: |
          set -euxo pipefail
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" <<'EOSSH'
          set -e
          ln -sfn "$APP_DIR/releases/${GITHUB_SHA}" "$APP_DIR/current"
          # nginx reload is only needed if you changed its config;
          # for static file updates, Nginx serves the new files via the symlink.
          sudo -n nginx -t && sudo -n systemctl reload nginx || true
          EOSSH
