name: Deploy frontend to VPS

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      APP_DIR: ${{ vars.APP_DIR || secrets.APP_DIR }}   # e.g. /var/www/myapp
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}                 # e.g. deploy
      SSH_PORT: ${{ secrets.SSH_PORT }}                 # e.g. 22
      BUILD_DIR: dist                                   # change to 'build' if your output differs

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install deps & build
        run: |
          set -euxo pipefail
          npm ci || (npm install --package-lock-only && npm ci)
          npm run build
          test -d "$BUILD_DIR" || (echo "Build dir '$BUILD_DIR' not found" && exit 1)

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Trust host (known_hosts)
        run: |
          set -euxo pipefail
          mkdir -p ~/.ssh
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Test SSH connectivity (optional but helpful)
        run: |
          set -euxo pipefail
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "echo CI-SSH-OK"

      - name: Ensure server dirs
        run: |
          set -euxo pipefail
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" <<EOSSH
          set -e
          mkdir -p "$APP_DIR/releases"
          EOSSH

      - name: Upload release
        run: |
          set -euxo pipefail
          rsync -azv --delete -e "ssh -p $SSH_PORT" \
            "$BUILD_DIR"/ "$SSH_USER@$SSH_HOST:$APP_DIR/releases/${GITHUB_SHA}/"

      - name: Activate release & reload Nginx (reload is optional)
        run: |
          set -euxo pipefail
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" <<EOSSH
          set -e
          ln -sfn "$APP_DIR/releases/${GITHUB_SHA}" "$APP_DIR/current"
          # Only needed if nginx config changed; safe to leave as-is.
          sudo -n nginx -t && sudo -n systemctl reload nginx || true
          EOSSH
