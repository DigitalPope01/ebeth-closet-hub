name: Deploy frontend to VPS

on:
  push:
    branches: [ "main" ]   # change if your default branch is different
  workflow_dispatch:       # lets you run it manually too

concurrency:
  group: deploy-frontend
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      APP_DIR: ${{ vars.APP_DIR || secrets.APP_DIR }}   # prefer variable, fallback to secret
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PORT: ${{ secrets.SSH_PORT }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install deps & build
        run: |
          npm ci
          npm run build
        # If your build output is NOT ./dist, set an env and adjust below:
        env:
          BUILD_DIR: dist

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Trust host (known_hosts)
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Create app dirs on server (first-run safe)
        run: |
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "\
            sudo mkdir -p \"$APP_DIR/releases\" && \
            sudo mkdir -p \"$APP_DIR\" && \
            sudo chown -R $SSH_USER:$SSH_USER \"$APP_DIR\" \
          "

      - name: Upload release
        run: |
          rsync -az --delete -e "ssh -p $SSH_PORT" \
            ./dist/ "$SSH_USER@$SSH_HOST:$APP_DIR/releases/${GITHUB_SHA}/"

      - name: Activate release & reload Nginx
        run: |
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" bash -lc "\
            set -euo pipefail; \
            ln -sfn \"$APP_DIR/releases/${GITHUB_SHA}\" \"$APP_DIR/current\"; \
            sudo nginx -t; \
            sudo systemctl reload nginx \
          "
